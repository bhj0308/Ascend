# Render Blueprint — creates the managed Postgres, the FastAPI backend, and the
# static frontend in one click: Render dashboard → New → Blueprint → this repo.
# Spec: https://render.com/docs/blueprint-spec   Guide: docs/DEPLOY.md
#
# Free-tier notes (upgrade before real traffic):
# - Free web services sleep after 15 min idle (first request is slow).
# - Free Postgres expires after 90 days.
# - preDeployCommand isn't available on free instances, so migrations run in
#   startCommand. That's safe with a single instance; switch to preDeployCommand
#   when you scale to more than one.

databases:
  - name: ascend-db
    plan: free
    databaseName: ascend
    user: ascend

services:
  - type: web
    name: ascend-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ascend-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # The static site's real URL (Render appended the suffix). Comma-separate if you
      # add a custom domain. Keep CORS_ORIGINS and APP_BASE_URL in sync.
      - key: CORS_ORIGINS
        value: https://ascend-web-irk7.onrender.com
      # Wildcard so the API accepts whatever suffixed hostname Render assigns it.
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
      # Frontend origin used in password-reset / verification email links. Same value as
      # CORS_ORIGINS (the static site's real URL) — update both together.
      - key: APP_BASE_URL
        value: https://ascend-web-irk7.onrender.com
      # Turn this to "true" the moment SENDGRID_API_KEY is set. Until then verification
      # links only reach the API log, so enforcing it would lock real users out.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Optional integrations — set in the dashboard when you have them; blank = disabled.
      # Without SENDGRID_API_KEY, emails are printed to the API's log instead of sent.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: noreply@ascendtalent.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: ascend-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: every path is served by index.html so React Router handles it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's real URL + /api. Baked in at build time: changing it requires a rebuild
      # (Render redeploys the static site when a blueprint env var changes).
      - key: VITE_API_URL
        value: https://ascend-api-onu3.onrender.com/api
